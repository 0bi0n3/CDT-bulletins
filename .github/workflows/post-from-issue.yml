name: Post bulletin from issue
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  post:
    # Only repo maintainers can publish this way.
    if: >-
      contains(github.event.issue.labels.*.name, 'bulletin') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add bulletin
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_CREATED: ${{ github.event.issue.created_at }}
        run: python3 scripts/issue_to_bulletin.py
      - name: Commit, deploy, close issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bulletins.json
          git commit -m "Bulletin from issue #$NUM"
          git push origin HEAD:main
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so dispatch the deploy.
          gh workflow run pages.yml --ref main
          gh issue close "$NUM" --comment "Published. It will be live in about a minute."
